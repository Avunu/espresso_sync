[project]
name = "espresso_sync"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "Two-way sync between Frappe documents and external REST APIs"
requires-python = ">=3.14"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
readme = "README.md"
dynamic = ["version"]
dependencies = [
	"jsonpath-ng",
	"jsonata-python>=0.7.1",
	"jsonschema>=4.26.0,<5",
	"openapi-spec-validator>=0.9.0,<0.10",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
siblings = []

[tool.frappe-nix.listing]
# Off the marketplace until the transform editor replaces the legacy maps.
publish = false

# The /espresso_sync page's React sources, built by Frappe's esbuild through
# public/js/espresso-sync.bundle.js and checked with the app's own tsconfig.json (JSX).
# The pure modules they import (public/js/editor) stay in the managed projects, with their tests.
[[tool.frappe-nix.typescript.spa]]
root = "."
include = ["espresso_sync/www/espresso_sync/src/**"]
tsconfig = "tsconfig.json"
check = "tsc -p tsconfig.json"

[[tool.frappe-nix.js.oxlint.overrides]]
# A Worker's postMessage has no target origin: the rule is for window.postMessage.
files = ["espresso_sync/public/js/editor/evalWorker.ts"]
rules = { "unicorn/require-post-message-target-origin" = "off" }

[[tool.frappe-nix.unchecked-js]]
path = "espresso_sync/espresso_sync/doctype/espresso_sync_connection/espresso_sync_connection.js"
reason = "Legacy map editor, replaced by the transform editor and deleted with the legacy executor"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = ["E501", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["espresso_sync"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 80

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/", ".devenv/", ".direnv/"]

[tool.test_utils.static-analysis]
whitelist = ["frappe.*"]
