swagger: "2.0"
info: { title: Shop, version: "1" }
host: api.example.com
basePath: /v1
schemes: [https]
paths:
  /orders:
    post:
      operationId: createOrder
      consumes: [application/json]
      produces: [application/json]
      parameters:
        - in: body
          name: body
          required: true
          schema: { $ref: "#/definitions/Order" }
      responses:
        "201": { description: ok, schema: { $ref: "#/definitions/Order" } }
definitions:
  Order:
    type: object
    required: [id, lines]
    properties:
      id: { type: integer }
      note: { type: string, x-nullable: true }
      placed: { type: string, format: date-time }
      lines: { type: array, items: { $ref: "#/definitions/Line" } }
  Line:
    type: object
    required: [sku]
    properties: { sku: { type: string }, qty: { type: number, minimum: 0 } }
